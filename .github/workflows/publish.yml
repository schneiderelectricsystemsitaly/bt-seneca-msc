name: "Release on npm"
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    name: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org
    - run: npm ci
    - name: Audit dependencies
      run: npm audit
    - name: Run tests
      run: npm test
    - name: Build and package release
      run: npm pack
    - name: Publish to npm
      run: |
        VERSION=$(node -p "require('./package.json').version")
        EXISTS=$(npm view bt-seneca-msc@$VERSION version 2>/dev/null || echo "")
        if [ -z "$EXISTS" ]; then
          npm publish "bt-seneca-msc-$VERSION.tgz" --provenance --access public
        else
          echo "Version $VERSION already published, skipping."
        fi
